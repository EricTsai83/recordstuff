# Free local signing. The App is signed; the DMG is only its container.
extends: ./electron-builder.yml
artifactName: RecordStuff-${version}-${arch}-selfsigned.${ext}
mac:
  notarize: false
  timestamp: none
dmg:
  sign: false
  writeUpdateInfo: false
  # Do not add dmg.contents here: `extends` concatenates arrays, and the DMG
  # must contain only the App and Applications entries from the base config.
