name: Website deployment
# All entry points share the same checks and production deployment lock.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:
  workflow_call:
    secrets:
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
permissions:
  contents: read
jobs:
  deploy:
    # Release callers run on a tag; direct/manual deployments must run on main.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: recordstuff-website-production
      cancel-in-progress: false
    # Resolve main only after acquiring the lock so queued deployments cannot
    # restore an older manifest or site. Running deployments are never cancelled.
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check whether the Vercel project is configured
        id: vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Website not deployed: VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.vercel.outputs.configured == 'true'
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.vercel.outputs.configured == 'true'
        with:
          version: 10.33.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.vercel.outputs.configured == 'true'
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Verify Vercel project access
        if: steps.vercel.outputs.configured == 'true'
        run: |
          node --input-type=module <<'NODE'
          const { VERCEL_TOKEN: token, VERCEL_ORG_ID: org, VERCEL_PROJECT_ID: project } = process.env;
          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }
          for (const [name, value, pattern] of [
            ["VERCEL_ORG_ID", org, /^team_[a-zA-Z0-9]+$/],
            ["VERCEL_PROJECT_ID", project, /^prj_[a-zA-Z0-9]+$/],
          ]) {
            if (!pattern.test(value ?? "")) fail(`${name} has an invalid format. Copy the ID without quotes, spaces, or backticks.`);
          }
          if (!token || /\s/.test(token)) fail("VERCEL_TOKEN is empty or contains whitespace. Replace the repository secret with the token only.");
          async function get(path, label) {
            let response;
            try {
              response = await fetch(`https://api.vercel.com${path}`, {
                headers: { Authorization: `Bearer ${token}` },
                signal: AbortSignal.timeout(15000),
              });
            } catch {
              fail(`${label}: network request failed or timed out. No deployment attempted.`);
            }
            if (!response.ok) {
              const hint = response.status === 401 || response.status === 403
                ? "Check token expiry and access to the project's Vercel team; also verify both IDs."
                : response.status === 404
                  ? "Check the project/team IDs and whether this token can see them."
                  : "Vercel returned an unexpected status; retry after checking service availability.";
              fail(`${label}: HTTP ${response.status}. ${hint}`);
            }
            try { return await response.json(); }
            catch { fail(`${label}: invalid JSON response.`); }
          }
          // The CLI reads both the team and project. Never print API bodies or credentials.
          await get(`/v2/teams/${encodeURIComponent(org)}`, "Vercel team access");
          const settings = await get(`/v9/projects/${encodeURIComponent(project)}?teamId=${encodeURIComponent(org)}`, "Vercel project access");
          if (settings.id !== project || settings.accountId !== org) fail("Vercel project ownership does not match the configured IDs.");
          if (settings.name !== "recordstuff" || settings.rootDirectory !== "website") fail("Expected the recordstuff project with Root Directory website. Check project configuration.");
          console.log("Vercel team and project access verified. No deployment performed by this check.");
          NODE
      - name: Install and check the website source
        if: steps.vercel.outputs.configured == 'true'
        run: |
          set -euo pipefail
          pnpm --dir website install --frozen-lockfile
          pnpm --dir website test
          pnpm --dir website exec astro check
      - name: Build, check and deploy the website to Vercel production
        if: steps.vercel.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # Run from the repository root: the Vercel project's Root Directory is website/.
          npx --yes vercel@59.23.2 pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@59.23.2 build --prod --token "$VERCEL_TOKEN"
          node website/scripts/check-release.mts --dir .vercel/output/static
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON website/scripts/check-links.mts --dir .vercel/output/static --offline
          url="$(npx --yes vercel@59.23.2 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")"
          echo "Deployed $url"
          {
            echo "### Website"
            echo
            echo "Deployed \`$url\` from main commit $(git rev-parse HEAD)."
          } >> "$GITHUB_STEP_SUMMARY"
