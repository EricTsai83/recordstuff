name: macOS release
# Tag = release. Pushing vX.Y.Z (or vX.Y.Z-rc.1 for a pre-release) builds,
# signs, verifies and publishes; nothing is published from branch pushes or
# by hand. Manual checks happen before tagging (docs/system-design/releases.md).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: recordstuff-macos-delivery
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      RECORDSTUFF_SIGN_IDENTITY: 01B373511530BBF287CA35E54C10A5F017AAD637
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Validate source and version
        run: |
          test "$(uname -m)" = arm64
          # Release only commits that are on main; a tag on a side branch stops here.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/release.mts preflight "$RELEASE_TAG"
      - run: pnpm install --frozen-lockfile
      - name: Install Electron runtime explicitly (Electron 44 has no postinstall)
        run: node node_modules/electron/install.js
      - run: pnpm check
      - name: Import fixed identity, build, and verify candidate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64" && test -n "$P12_PASSWORD"
          keychain="$RUNNER_TEMP/recordstuff-signing.keychain-db"
          cert="$RUNNER_TEMP/recordstuff-signing.pem"
          archive="$RUNNER_TEMP/recordstuff-signing.p12"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          trap 'python3 scripts/cleanup-release-keychain.py' EXIT
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$archive"
          chmod 600 "$archive"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$archive" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security find-certificate -c 'RecordStuff Dev' -p "$keychain" > "$cert"
          fingerprint="$(openssl x509 -in "$cert" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          test "$fingerprint" = "$RECORDSTUFF_SIGN_IDENTITY"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$cert"
          security find-identity -v -p codesigning "$keychain" | grep -F "$RECORDSTUFF_SIGN_IDENTITY"
          unset BUILD_CERTIFICATE_BASE64 P12_PASSWORD
          pnpm dist:mac
          node scripts/release.mts candidate "$RELEASE_TAG" dist
      - name: Cleanup even after cancellation or setup failure
        if: always()
        run: python3 scripts/cleanup-release-keychain.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/RecordStuff-*-arm64-selfsigned.dmg
            dist/SHA256SUMS
            dist/release.json
  publish:
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-candidate
          path: candidate
      - name: Reverify the candidate without private keys and publish it
        run: node scripts/release.mts publish "$RELEASE_TAG" candidate
