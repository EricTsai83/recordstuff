name: macOS release
# Tag = release, and the tag is the version. Pushing vX.Y.Z (or vX.Y.Z-rc.1
# for a pre-release) stamps that version into the build, signs, verifies and
# publishes, re-downloads the public assets as an anonymous user and verifies
# them again, then records the release facts back on main (stable tags only).
# App publication only follows tag pushes; local acceptance happens before
# tagging (docs/system-design/releases.md). Dispatch only verifies a published
# release. Website changes deploy independently through website.yml, also
# called after stable release facts are recorded on main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to re-verify from its public download URL (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: recordstuff-macos-delivery
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      RECORDSTUFF_SIGN_IDENTITY: 01B373511530BBF287CA35E54C10A5F017AAD637
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Validate source and version
        run: |
          test "$(uname -m)" = arm64
          # Release only commits that are on main; a tag on a side branch stops here.
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/release.mts preflight "$RELEASE_TAG"
      - name: Stamp the tag's version into package.json for this build
        run: node scripts/release.mts version "$RELEASE_TAG"
      - run: pnpm install --frozen-lockfile
      - name: Install Electron runtime explicitly (Electron 44 has no postinstall)
        run: node node_modules/electron/install.js
      - run: pnpm check
      - name: Import fixed identity, build, and verify candidate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$BUILD_CERTIFICATE_BASE64" && test -n "$P12_PASSWORD"
          keychain="$RUNNER_TEMP/recordstuff-signing.keychain-db"
          cert="$RUNNER_TEMP/recordstuff-signing.pem"
          archive="$RUNNER_TEMP/recordstuff-signing.p12"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          trap 'python3 scripts/cleanup-release-keychain.py' EXIT
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$archive"
          chmod 600 "$archive"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$archive" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security find-certificate -c 'RecordStuff Dev' -p "$keychain" > "$cert"
          fingerprint="$(openssl x509 -in "$cert" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          test "$fingerprint" = "$RECORDSTUFF_SIGN_IDENTITY"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$keychain" "$cert"
          security find-identity -v -p codesigning "$keychain" | grep -F "$RECORDSTUFF_SIGN_IDENTITY"
          unset BUILD_CERTIFICATE_BASE64 P12_PASSWORD
          pnpm dist:mac
          node scripts/release.mts candidate "$RELEASE_TAG" dist
      - name: Cleanup even after cancellation or setup failure
        if: always()
        run: python3 scripts/cleanup-release-keychain.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/RecordStuff-*-arm64-selfsigned.dmg
            dist/SHA256SUMS
            dist/release.json
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-candidate
          path: candidate
      - name: Reverify the candidate without private keys and publish it
        run: node scripts/release.mts publish "$RELEASE_TAG" candidate
  verify-published:
    # Runs after a successful publish, or alone on dispatch. Downloads what an
    # anonymous user gets from the public URL and reruns every artifact gate.
    # A failure here flags the release for the maintainer; it never unpublishes.
    # The checkout is the workflow's own ref (main on dispatch), so current
    # tooling can verify older tags; version and commit come from the tag.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    needs: publish
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - name: Download the public assets anonymously
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir published
          for name in "RecordStuff-$version-arm64-selfsigned.dmg" SHA256SUMS release.json; do
            curl -fsSL --retry 3 -o "published/$name" "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name"
          done
          (cd published && shasum -a 256 -c SHA256SUMS)
      - name: Verify mounted contents, signatures, metadata and GitHub asset digests
        run: node scripts/release.mts published "$RELEASE_TAG" published
  record:
    # Stable tag pushes only: after the public download verified, write the
    # release facts (package.json version, README download block, bilingual
    # verification record skeleton) back to main. Only these files change;
    # the maintainer completes the record's fill-in sections afterwards.
    if: github.event_name == 'push'
    needs: verify-published
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - name: Write release facts into the repository
        run: node scripts/release.mts record "$RELEASE_TAG"
      - name: Refresh the website release manifest from the published release (stable tags only)
        # Pre-release tags (vX.Y.Z-suffix) still get their verification record above,
        # but the website only ever advertises stable releases.
        if: ${{ !contains(github.ref_name, '-') }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON website/scripts/manifest.mts generate "$RELEASE_TAG"
      - name: Commit and push to main
        run: |
          set -euo pipefail
          git add package.json README.md README.zh-TW.md docs/verification/releases docs/zh-TW/verification/releases website/release-manifest.json
          if git diff --cached --quiet; then echo "Nothing to record."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(release): record published $RELEASE_TAG"
          git push origin HEAD:main
  deploy-website:
    # GITHUB_TOKEN pushes do not trigger push workflows. Call the shared
    # deployment explicitly after the verified stable manifest is on main.
    if: ${{ !cancelled() && github.event_name == 'push' && !contains(github.ref_name, '-') && needs.record.result == 'success' }}
    needs: record
    uses: ./.github/workflows/website.yml
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
