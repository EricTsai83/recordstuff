[package]
name = "recordstuff-capture"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "RecordStuff's native capture engine (plan 076): capture, encoding and the hybrid MP4 muxer."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-video = { version = "0.3", features = ["objc2-metal"] }
objc2-video-toolbox = "0.3"
objc2-audio-toolbox = "0.3"
objc2-core-audio-types = "0.3"
objc2-app-kit = "0.3"
# The microphone's authorization (074), whose sound comes from CoreAudio's HAL (plan 078, mac/hal.rs), and the
# camera probe's device list (mac/live_test.rs).
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVCaptureDevice",
    "AVMediaFormat",
    # The camera (plan 075, mac/camera.rs).
    "AVCaptureInput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureSessionPreset",
    "AVCaptureVideoDataOutput",
    "dispatch2",
    "objc2-core-media",
    "objc2-core-video",
] }
# Composing the camera into the recording's frames on the GPU with the shader build.rs translates (plan 075,
# mac/compositor.rs).
objc2-metal = { version = "0.3", default-features = false, features = [
    "std",
    "MTLAllocation",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Win32_Devices_FunctionDiscovery",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The camera layout's cases shared with the TypeScript tests (src/shared/camera-layout.cases.json).
serde_json = "1"

[build-dependencies]
napi-build = "2"
# The camera compositor's one shader source, translated at build time (plan 075, D15; build.rs). Nothing of it ships.
naga = { version = "30", default-features = false, features = ["wgsl-in", "msl-out", "hlsl-out"] }

[profile.release]
lto = true
codegen-units = 1
