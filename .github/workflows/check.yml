name: Check
# `pnpm check`, the background UI suite (`pnpm test:ui`) and its cleanup drills
# (`pnpm test:ui:drills`) on every push to main and every pull request, on the same
# runner images and Node/pnpm versions the release builds use, so a commit
# that breaks the types, the tests or the build on either platform is caught
# before a tag is pushed rather than by the release job. The UI suite runs hidden,
# offscreen Electron; it is no evidence of native windows, input or capture (plan 066). The Windows job also
# packages the unsigned installer as a short-lived build artifact, because no
# maintainer machine can build it; nothing here signs, records or publishes
# (docs/system-design/releases.md). Dispatch runs every job on any branch.
# `pnpm check` and the installer build plan 076's native capture engine with the runner's Rust (`cargo test`, then a
# load of the built module, then the installed one); Cargo's output is cached per job. Only the release builds go
# without that cache, so what is published is built from source alone.
#
# The work is split across runners so the slowest part sets the time (2026-10-09; about 17 minutes before):
# `pnpm check` and then the drills on its build, per platform; the background suite in four shards per
# platform (one worker each, as on a developer machine; four keep macOS within the five runners a free account
# runs at once); and the Windows installer. Every check still runs on both platforms.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!plans/**'
      - '!website/**'
      # scripts/release.test.ts renders both READMEs' download block from the
      # website manifest, so a change to any of the three must run the check.
      - 'README.md'
      - 'README.zh-TW.md'
      - 'website/release-manifest.json'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!plans/**'
      - '!website/**'
      - 'README.md'
      - 'README.zh-TW.md'
      - 'website/release-manifest.json'
permissions:
  contents: read
concurrency:
  group: recordstuff-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Electron runtime explicitly (Electron 44 has no postinstall)
        if: runner.os == 'Windows'
        run: node node_modules/electron/install.js
      # Plan 076's native capture engine: `pnpm check` builds and tests it with Cargo, whose output this keeps.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/capture
      - run: pnpm check
      # On the build pnpm check just made.
      - run: pnpm test:ui:drills
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: drill-failures-${{ runner.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
  ui:
    name: ui ${{ matrix.shard }}/4 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    # A quarter of the background suite, about 2–3 minutes on a runner; the whole suite takes about 3.5 minutes on a developer Mac.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Electron runtime explicitly (Electron 44 has no postinstall)
        if: runner.os == 'Windows'
        run: node node_modules/electron/install.js
      # The background suite never records, so it needs no native capture engine (plan 076).
      - run: pnpm build
        env:
          RECORDSTUFF_SKIP_NATIVE: "1"
      - run: pnpm test:ui --shard=${{ matrix.shard }}/4
      # Plan 078 step 5: how long each launch took to close, the slowest first, passing or not.
      - name: Slowest closes
        if: always()
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ui-close-timings.mts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-failures-${{ runner.os }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/ui/
            test-results/ui-summary.json
            test-results/ui-report.json
            test-results/ui-close-timings.jsonl
          if-no-files-found: ignore
          retention-days: 7
  windows-installer:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Electron runtime explicitly (Electron 44 has no postinstall)
        run: node node_modules/electron/install.js
      # Plan 076's native capture engine: `pnpm dist:win` builds it with Cargo, whose output this keeps.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/capture
      - run: pnpm dist:win
      - name: Install, inspect and uninstall the installer on this runner
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release.mts windows-smoke dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          if-no-files-found: error
          retention-days: 7
          path: dist/RecordStuff-*-x64-unsigned-setup.exe
  native-windows:
    # Plan 076, step 3: the native capture engine on Windows, which only CI checks (D8). The unit tests cover the
    # shared session core and Media Foundation's encoders on synthetic media; ffprobe then decodes that file; a live
    # recording of this runner's display and system audio follows, and a session that cannot capture is reported in
    # the job summary as untested rather than failed; last, Node loads the built module as the capture host would.
    name: native engine (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
      - run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/capture
      - name: Unit tests, including Media Foundation's encoders on synthetic media
        working-directory: native/capture
        env:
          RECORDSTUFF_SYNTHETIC_OUT: ${{ runner.temp }}\synthetic.mp4
        run: cargo test --lib
      - name: Decode the synthetic recording
        shell: pwsh
        run: |
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress | Out-Null }
          $file = Join-Path $env:RUNNER_TEMP 'synthetic.mp4'
          ffprobe -v error -show_entries 'stream=codec_name,profile,width,height,sample_rate,channels,duration' -of json $file
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $errors = ffmpeg -v error -i $file -f null - 2>&1
          if ($LASTEXITCODE -ne 0 -or $errors) { Write-Output $errors; exit 1 }
          "Synthetic H.264 and AAC from Media Foundation decoded without errors." >> $env:GITHUB_STEP_SUMMARY
      # Each part alone, then the whole session, each in its own process: a crash names its part. Every step runs
      # whatever the one before did, so one run shows them all.
      - name: Live system audio alone
        if: ${{ !cancelled() }}
        working-directory: native/capture
        run: cargo test --lib -- --ignored --nocapture live_sound
      - name: Live display alone
        if: ${{ !cancelled() }}
        working-directory: native/capture
        run: cargo test --lib -- --ignored --nocapture live_display
      - name: A live recording of this runner's display and system audio
        if: ${{ !cancelled() }}
        working-directory: native/capture
        run: cargo test --lib -- --ignored --nocapture live_capture
      - name: Live sound of one process, and the microphone if the runner has one
        if: ${{ !cancelled() }}
        working-directory: native/capture
        run: cargo test --lib -- --ignored --nocapture live_one_process
      - name: A live recording of an area of the display
        if: ${{ !cancelled() }}
        working-directory: native/capture
        run: cargo test --lib -- --ignored --nocapture live_area
      - name: A live recording of a window the test opens
        if: ${{ !cancelled() }}
        working-directory: native/capture
        run: cargo test --lib -- --ignored --nocapture live_window
      - name: On failure, the live tests again under the debugger with full page heap
        # Page heap stops at the first bad write or free instead of a later heap check, and cdb prints the stack.
        if: ${{ failure() }}
        working-directory: native/capture
        shell: pwsh
        run: |
          $debuggers = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64'
          $cdb = Join-Path $debuggers 'cdb.exe'
          if (-not (Test-Path $cdb)) { "cdb is not on this runner; no stack." ; exit 0 }
          $exe = Get-ChildItem target\debug\deps\recordstuff_capture-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & (Join-Path $debuggers 'gflags.exe') /p /enable $exe.Name /full
          foreach ($filter in 'live_sound', 'live_display', 'live_capture', 'live_one_process', 'live_area', 'live_window') {
            "=== $filter"
            & $cdb -lines -y $exe.DirectoryName -G -c 'sxe -c "kP 40; q" av; sxe -c "kP 40; q" c0000374; sxe -c "kP 40; q" bpe; g' $exe.FullName --ignored --nocapture --test-threads=1 $filter
          }
          exit 0
      - name: Build the module and load it in Node
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        working-directory: native/capture
        shell: pwsh
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $module = Join-Path $env:RUNNER_TEMP 'recordstuff-capture.node'
          Copy-Item target\release\recordstuff_capture.dll $module
          # The event callback's threadsafe function keeps Node running, so it exits once probe answers.
          node -e "const m = require(process.argv[1]); const c = new m.NativeCapture(() => {}); c.probe(0, null).then((s) => console.log('loaded; probe', JSON.stringify(s)), (e) => console.log('loaded; probe refused:', e.message)).then(() => c.microphones()).then((l) => console.log('microphones', JSON.stringify(l)), (e) => console.log('microphones refused:', e.message)).finally(() => process.exit(0));" $module
          if ($LASTEXITCODE -ne 0) { exit 1 }
