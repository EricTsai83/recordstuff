appId: com.ericts.record
productName: RecordStuff
copyright: Copyright © 2026 Eric Tsai
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - "*.png"
      - "*.ico"
asar: true
mac:
  icon: build/icon.icns
  category: public.app-category.video
  target:
    - dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # The supported release command supplies and verifies the fixed self-signed identity.
  notarize: false
  # No LSUIElement (2026-10-05): main hides the Dock icon as it launches and shows it while the window is open,
  # so reopening from Finder or Spotlight brings RecordStuff's own menus (src/main/menus/app-menu.ts).
  extendInfo:
    NSScreenCaptureUsageDescription: RecordStuff needs screen recording access to capture the primary display and system audio.
    NSAudioCaptureUsageDescription: RecordStuff records audio played by your computer.
dmg:
  # Installer UI: the App, an Applications link and a drag arrow only. Help,
  # update and removal guidance live on GitHub; no documents are bundled.
  # background.png/@2x are generated by `pnpm icons`; the 540×380 image sets
  # the Finder window size and its arrow is drawn between these icon centers.
  background: background.png
  iconSize: 128
  contents:
    - x: 130
      y: 190
    - x: 410
      y: 190
      type: link
      path: /Applications
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # Unsigned (docs/system-design/decisions.md): the asset name says so, as
  # -selfsigned does for the DMG. rcedit still stamps the icon and version.
  artifactName: RecordStuff-${version}-${arch}-unsigned-setup.${ext}
nsis:
  # Per-user one-click install without an admin prompt. Its Start-menu shortcut
  # carries the appId as AppUserModelID, which Windows toasts require.
  oneClick: true
  perMachine: false
  # Uninstalling never deletes settings, history or recordings.
  deleteAppDataOnUninstall: false
  # No auto-updater, so no blockmap for differential downloads.
  differentialPackage: false
