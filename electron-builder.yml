appId: com.recordstuff.app
productName: RecordStuff
copyright: Copyright © 2026 Eric Tsai
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - "*.png"
      - "*.ico"
asar: true
mac:
  icon: build/icon.icns
  category: public.app-category.video
  target:
    - dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # The supported release command supplies and verifies the fixed self-signed identity.
  notarize: false
  extendInfo:
    LSUIElement: true
    NSScreenCaptureUsageDescription: RecordStuff needs screen recording access to capture the primary display and system audio.
    NSAudioCaptureUsageDescription: RecordStuff records audio played by your computer.
dmg:
  contents:
    - x: 130
      y: 150
    - x: 410
      y: 150
      type: link
      path: /Applications
win:
  target:
    - nsis
  # Signing uses the certificate in CSC_LINK / CSC_KEY_PASSWORD when present;
  # otherwise an unsigned build is produced (see README).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: false
  deleteAppDataOnUninstall: false
