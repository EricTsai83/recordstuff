name: Check
# `pnpm check` on every push to main and every pull request, on the same
# runner images and Node/pnpm versions the release builds use, so a commit
# that breaks the types, the tests or the build on either platform is caught
# before a tag is pushed rather than by the release job. The Windows job also
# packages the unsigned installer as a short-lived build artifact, because no
# maintainer machine can build it; nothing here signs, records or publishes
# (docs/system-design/releases.md). Dispatch runs both jobs on any branch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!plans/**'
      - '!website/**'
      # scripts/release.test.ts renders both READMEs' download block from the
      # website manifest, so a change to any of the three must run the check.
      - 'README.md'
      - 'README.zh-TW.md'
      - 'website/release-manifest.json'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!plans/**'
      - '!website/**'
      - 'README.md'
      - 'README.zh-TW.md'
      - 'website/release-manifest.json'
permissions:
  contents: read
concurrency:
  group: recordstuff-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  check-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Electron runtime explicitly (Electron 44 has no postinstall)
        run: node node_modules/electron/install.js
      - run: pnpm check
      - run: pnpm dist:win
      - name: Install, inspect and uninstall the installer on this runner
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release.mts windows-smoke dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          if-no-files-found: error
          retention-days: 7
          path: dist/RecordStuff-*-x64-unsigned-setup.exe
